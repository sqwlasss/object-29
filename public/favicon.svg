<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ØBJECT 29. The mark is drawn as geometry, not type, so it renders
       identically without the Archivo webfont. Cobalt is the structural ink. -->
  <rect width="64" height="64" fill="#1B398D"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#F2EEE3" stroke-width="7"/>
  <line x1="17" y1="47" x2="47" y2="17" stroke="#F2EEE3" stroke-width="7" stroke-linecap="butt"/>
</svg>
